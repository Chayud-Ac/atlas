version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ADR 0013: typescript-eslint doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The runtime is Node 24, so its types stay on 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Must match the versions @azure/monitor-opentelemetry depends on. A second copy means a
      # second ESM hook, and Express goes untraced. Move them by hand when it moves.
      - dependency-name: '@opentelemetry/instrumentation'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@opentelemetry/instrumentation-express'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node 24 is the LTS line the repo targets (package.json engines); 25 isn't LTS.
      - dependency-name: node
        update-types: ['version-update:semver-major']
