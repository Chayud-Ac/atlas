# Local development dependencies: docker compose up -d
name: atlas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local-only superuser; the apps never use it
    ports:
      - '5432:5432'
    volumes:
      - ./dev/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d atlas']
      interval: 2s
      timeout: 3s
      retries: 15

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.6
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    ports:
      - '8090:8080'
    volumes:
      - ./dev/mock-oidc/config.json:/config/mock-oidc.json:ro

volumes:
  postgres-data:
